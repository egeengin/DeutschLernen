name: CI & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite, E2E Simulation & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Node.js Headless Test Suites
        run: |
          node tests/test_vocab_trainer.js
          node tests/test_voice_exam_engine.js
          node tests/test_live_letter_grader_dom.js
          node tests/test_lesen_reader_dom.js
          node tests/test_portal_dom.js
          node tests/test_e2e_simulation.js

      - name: Run Full Python Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Build Programmatic SEO Static Pages & Verify
        run: |
          python scripts/build_seo_pages.py
          python tests/test_seo_pages.py

      - name: Run Automated Zero-Dependency Coverage Report
        run: |
          python scripts/run_coverage.py
