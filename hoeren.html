<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎧 Hören Studio & Audio-Prüfung — telc Deutsch B1 | DeutschLernen</title>
  <meta name="description" content="Interaktives Hörverstehen-Studio für die telc Deutsch B1 Prüfung. Authentische Prüfungsdurchsagen, Interviews und Telefonansagen mit 30-Minuten-Prüfungstimer und Lösungsanalyse.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b5cf6">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <script>
    (function() {
      const savedTheme = localStorage.getItem('deutschlernen_theme') || localStorage.getItem('telc_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      if (savedTheme === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>

  <!-- Hören Studio Styles -->
  <link rel="stylesheet" href="css/hoeren.css?v=40">
</head>
<body class="hr-body">

  <div class="hr-container">

    <!-- Top Navigation Bar -->
    <header class="hr-top-bar">
      <div class="hr-brand-group">
        <div class="hr-brand-icon">🎧</div>
        <div>
          <h1 class="hr-brand-title" data-i18n="brandTitle">Hören Studio & Audio-Prüfung</h1>
          <p class="hr-brand-subtitle" data-i18n="brandSub">telc Deutsch B1 Listening Comprehension • 75 Punkte • 30 Min. Simulator</p>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <nav style="display:flex; gap:8px; flex-wrap:wrap;">
          <a href="index.html" class="hr-nav-link" data-i18n="homeLink">🏠 Hauptportal</a>
          <a href="trainer.html" class="hr-nav-link" data-i18n="vocabLink">⚡ Wortschatz</a>
          <a href="sprechen.html" class="hr-nav-link" data-i18n="sprechLink">🗣️ Sprechen</a>
          <a href="lesen.html" class="hr-nav-link" data-i18n="lesenLink">📖 Lesen</a>
          <a href="legal.html" class="hr-nav-link" data-i18n="legalLink">⚖️ Impressum</a>
        </nav>
        <div class="ls-lang-toggle" aria-label="Language selection" style="display:flex; gap:4px;">
          <button class="hr-opt-btn active" data-lang="en" onclick="setHoerenLang('en')" style="padding:6px 10px; font-size:12px;">EN</button>
          <button class="hr-opt-btn" data-lang="tr" onclick="setHoerenLang('tr')" style="padding:6px 10px; font-size:12px;">TR</button>
          <button class="hr-opt-btn" data-lang="ar" onclick="setHoerenLang('ar')" style="padding:6px 10px; font-size:12px;">AR</button>
          <button class="hr-opt-btn" data-lang="uk" onclick="setHoerenLang('uk')" style="padding:6px 10px; font-size:12px;">UK</button>
        </div>
        <button class="hr-opt-btn" id="btn-theme-toggle" title="Toggle Theme" aria-label="Toggle Theme" style="padding:6px 10px;">
          ☀️
        </button>
      </div>
    </header>

    <!-- Exam Test Selector Bar: Übungstest 1, 2, 3 -->
    <div class="hr-test-bar" id="hr-test-bar">
      <div class="hr-test-pills" id="hr-test-pills" role="tablist" aria-label="Hörverstehen Testauswahl">
        <!-- Injected dynamically by js/hoerenApp.js -->
      </div>
      <div style="font-size:12.5px; font-weight:700; color:var(--hr-text-gold);" id="hr-test-meta-badge">
        🎯 telc B1 75 Punkte • 30 Min.
      </div>
    </div>

    <!-- Part Tabs -->
    <nav class="hr-part-tabs" id="hr-part-tabs" aria-label="Listening exam parts navigation">
      <!-- Injected dynamically by js/hoerenApp.js -->
    </nav>

    <!-- Split Layout Grid -->
    <div class="hr-layout-grid">

      <!-- LEFT: Audio Console & Exam Guidance -->
      <main class="hr-card" id="hr-player-card">
        <h2 id="hr-test-title" style="margin-top:0; font-size:18px; font-weight:800; letter-spacing:-0.01em;">
          Hörverstehen wird geladen...
        </h2>
        <div id="hr-part-instruction" style="font-size:13.5px; color:var(--hr-text-muted); margin-bottom:20px; line-height:1.6;">
        </div>

        <!-- Audio Console Panel -->
        <div class="hr-player-console" id="hr-player-container">
          <div class="hr-player-header">
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="hr-play-badge" id="hr-play-count-badge">0x / Max 1x</span>
              <div class="hr-equalizer" id="hr-equalizer">
                <div class="hr-eq-bar"></div>
                <div class="hr-eq-bar"></div>
                <div class="hr-eq-bar"></div>
                <div class="hr-eq-bar"></div>
                <div class="hr-eq-bar"></div>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <label for="hr-speed-select" style="font-size:12px; color:var(--hr-text-muted);" data-i18n="speedLabel">Tempo:</label>
              <select id="hr-speed-select" class="hr-speed-select">
                <option value="0.85">0.85x (Langsamer)</option>
                <option value="1.0" selected>1.0x (Standard)</option>
                <option value="1.15">1.15x (Schneller)</option>
              </select>
            </div>
          </div>

          <div class="hr-player-controls">
            <button type="button" class="hr-btn-play" id="btn-play-audio">
              <span>▶</span> <span data-i18n="btnPlay">Audio abspielen</span>
            </button>
            <button type="button" class="hr-opt-btn" id="btn-stop-audio">
              <span>⏹</span> <span data-i18n="btnStopAudio">Stopp</span>
            </button>
          </div>
        </div>

        <!-- Examination Timer & Regulation Info -->
        <div style="background:var(--hr-bg-input); border:1px solid var(--hr-border-card); border-radius:var(--hr-radius-md); padding:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
          <div style="display:flex; align-items:center; gap:8px;">
            <span>⏱️</span>
            <span style="font-weight:700; font-size:13px;" data-i18n="timerLabel">Prüfungstimer:</span>
            <span id="hr-timer-display" style="font-family:monospace; font-weight:800; font-size:18px; color:var(--hr-text-gold);">30:00</span>
          </div>
          <div style="display:flex; gap:6px;">
            <button type="button" class="hr-opt-btn" id="btn-timer-toggle" style="padding:6px 12px; font-size:12px;" data-i18n="btnStartTimer">Start</button>
            <button type="button" class="hr-opt-btn" id="btn-timer-reset" style="padding:6px 12px; font-size:12px;" data-i18n="btnResetTimer">Reset</button>
          </div>
        </div>
      </main>

      <!-- RIGHT: Questions Arena, Transcripts & Evaluation -->
      <aside class="hr-card" id="hr-questions-card">
        <!-- Score Banner placeholder -->
        <div id="hr-score-banner" style="display:none;"></div>

        <!-- Questions injected dynamically -->
        <div id="hr-questions-container">
          <!-- Injected questions by js/hoerenApp.js -->
        </div>
      </aside>

    </div>

  </div>

  <!-- Scripts -->
  <script src="data/hoerenData.js?v=42"></script>
  <script src="js/hoerenApp.js?v=42"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            reg.update();
            console.log('Hören SW registered & checked for update:', reg.scope);
          })
          .catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
